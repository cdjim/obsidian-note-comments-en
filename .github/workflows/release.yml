name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write       # criar o release e anexar assets
  id-token: write       # exigido pela geração de attestation
  attestations: write   # registrar a attestation de proveniência

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Gerar attestation de proveniência dos assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Criar release com os assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Release automático de \`$GITHUB_REF_NAME\` com attestation de proveniência." \
            main.js manifest.json styles.css
